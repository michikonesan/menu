<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍱 今日の献立</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #F7F6F2;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }
    .app { max-width: 560px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2.5rem; }
    .header h1 { font-size: 26px; font-weight: 600; letter-spacing: 0.04em; }
    .header p { font-size: 13px; color: #888; margin-top: 6px; }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8e8e4;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .section-label {
      font-size: 11px; font-weight: 600; color: #999;
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
    }
    .people-row { display: flex; align-items: center; gap: 14px; }
    .people-count { font-size: 28px; font-weight: 600; min-width: 36px; text-align: center; }
    .people-unit { font-size: 15px; color: #888; }
    .people-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid #ddd; background: #f5f5f3;
      font-size: 22px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: #444;
      transition: background 0.15s;
    }
    .people-btn:hover { background: #ebebea; }
    .people-btn:active { transform: scale(0.95); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 14px; border-radius: 20px;
      border: 1px solid #ddd; background: #fafafa;
      font-size: 14px; cursor: pointer; color: #666;
      transition: all 0.15s; user-select: none;
    }
    .chip:hover { border-color: #bbb; color: #333; }
    .chip.active-time { background: #EBF3FD; border-color: #4A90D9; color: #1C5C9E; font-weight: 500; }
    .chip.active-mood { background: #EAF3DE; border-color: #4A8E20; color: #2E6010; font-weight: 500; }
    .easy-label { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .easy-label input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; accent-color: #D4820A; flex-shrink: 0; }
    .easy-text strong { font-size: 15px; font-weight: 500; display: block; }
    .easy-text span { font-size: 12px; color: #888; margin-top: 2px; display: block; }
    .card.easy-active { background: #FFFBF2; border-color: #F0B840; }
    .card.easy-active .easy-text strong { color: #7A4800; }
    .card.easy-active .easy-text span { color: #A86500; }
    .generate-btn {
      width: 100%; padding: 16px; border-radius: 14px;
      border: none; background: #4A8E20; color: #fff;
      font-size: 17px; font-weight: 600; cursor: pointer;
      letter-spacing: 0.03em; transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .generate-btn:hover { background: #3A7018; }
    .generate-btn:active { transform: scale(0.98); }
    .result-wrap {
      background: #fff; border-radius: 16px;
      border: 1px solid #e8e8e4; padding: 1.25rem; margin-top: 1rem;
    }
    .result-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #f0f0ec;
    }
    .result-title { font-size: 14px; font-weight: 500; color: #555; }
    .total-cal { font-size: 13px; color: #888; }
    .total-cal strong { color: #1a1a1a; font-weight: 600; }
    .meal-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 11px 0; border-bottom: 1px solid #f4f4f0;
    }
    .meal-row:last-of-type { border-bottom: none; padding-bottom: 0; }
    .meal-time { font-size: 11px; font-weight: 600; color: #999; min-width: 28px; padding-top: 3px; }
    .meal-info { flex: 1; }
    .meal-name { font-size: 16px; font-weight: 500; }
    .meal-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .meal-ingredients { font-size: 12px; color: #999; }
    .cal-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; background: #EAF3DE; color: #2E6010;
    }
    .easy-badge {
      font-size: 11px; padding: 2px 8px;
      border-radius: 10px; background: #FEF3E2; color: #A86500;
    }
    .retry-btn {
      margin-top: 14px; width: 100%; padding: 11px;
      border-radius: 10px; border: 1px solid #e0e0dc;
      background: transparent; font-size: 14px; cursor: pointer; color: #666;
      transition: background 0.15s;
    }
    .retry-btn:hover { background: #f5f5f3; }
    .no-result {
      text-align: center; padding: 2rem 1rem;
      color: #888; font-size: 14px; line-height: 1.8;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🍱 今日の献立</h1>
    <p>気分と人数を選んで、献立を決めましょう</p>
  </div>

  <div class="card">
    <div class="section-label">人数</div>
    <div class="people-row">
      <button class="people-btn" id="dec">−</button>
      <span class="people-count" id="people-count">2</span>
      <span class="people-unit">人</span>
      <button class="people-btn" id="inc">＋</button>
    </div>
  </div>

  <div class="card">
    <div class="section-label">食事の時間帯（複数可・未選択で全対象）</div>
    <div class="chips" id="time-chips">
      <div class="chip" data-val="朝食">🌅 朝食</div>
      <div class="chip" data-val="昼食">☀️ 昼食</div>
      <div class="chip" data-val="夕食">🌙 夕食</div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">今日の気分（複数可・未選択で全対象）</div>
    <div class="chips" id="mood-chips">
      <div class="chip" data-val="ご飯・おかず">🍚 ご飯・おかず</div>
      <div class="chip" data-val="麺類">🍜 麺類</div>
      <div class="chip" data-val="丼もの">🥣 丼もの</div>
      <div class="chip" data-val="パン・洋食">🍞 パン・洋食</div>
      <div class="chip" data-val="鍋・汁物">🍲 鍋・汁物</div>
      <div class="chip" data-val="サラダ・軽食">🥗 サラダ・軽食</div>
    </div>
  </div>

  <div class="card" id="easy-card">
    <label class="easy-label">
      <input type="checkbox" id="easy-check">
      <div class="easy-text">
        <strong>ずぼら飯モード</strong>
        <span>手間なし・時短・洗い物少なめな献立にする</span>
      </div>
    </label>
  </div>

  <button class="generate-btn" id="gen-btn">✨ 献立を決める</button>
  <div id="result-area"></div>
</div>

<script>
// ─── レシピデータ ───────────────────────────────────────────
const RECIPES = [
  // トキワ（時短・ずぼら向け）
  { name:"豚丼", ingredients:"豚バラ肉・玉ねぎ", cal:520, categories:["丼もの"], meals:["昼食","夕食"], easy:true },
  { name:"たたききゅうり", ingredients:"きゅうり", cal:20, categories:["サラダ・軽食"], meals:["昼食","夕食"], easy:true, side:true },
  { name:"豆腐とわかめのお吸い物", ingredients:"豆腐・わかめ", cal:40, categories:["鍋・汁物"], meals:["朝食","昼食","夕食"], easy:true, side:true },
  { name:"坦々なす", ingredients:"なす・ごま・豚ひき肉", cal:210, categories:["ご飯・おかず"], meals:["夕食"], easy:true },
  { name:"トマトのかき玉スープ", ingredients:"トマト・卵", cal:80, categories:["鍋・汁物"], meals:["朝食","昼食","夕食"], easy:true, side:true },
  { name:"漬けまぐろ丼", ingredients:"まぐろ・しょうゆ・みりん", cal:380, categories:["丼もの"], meals:["昼食","夕食"], easy:true },
  { name:"なすごま酢和え", ingredients:"なす・ごま・酢", cal:60, categories:["サラダ・軽食"], meals:["昼食","夕食"], easy:true, side:true },
  { name:"みょうがとオクラのお吸い物", ingredients:"みょうが・オクラ", cal:30, categories:["鍋・汁物"], meals:["昼食","夕食"], easy:true, side:true },
  { name:"トマトとアボカドのマリネうどん", ingredients:"トマト・アボカド・冷凍うどん", cal:490, categories:["麺類"], meals:["昼食"], easy:true },
  { name:"レタスとごまのスープ", ingredients:"レタス・ごま", cal:45, categories:["鍋・汁物"], meals:["朝食","昼食","夕食"], easy:true, side:true },
  { name:"いわしの蒲焼き", ingredients:"いわし・しょうゆ・みりん", cal:280, categories:["ご飯・おかず"], meals:["昼食","夕食"], easy:true },
  { name:"オクラとしらすの納豆和え", ingredients:"オクラ・しらす・納豆", cal:120, categories:["サラダ・軽食"], meals:["朝食","昼食","夕食"], easy:true, side:true },
  { name:"ニラだれ鶏冷しゃぶ", ingredients:"鶏胸肉・ニラ", cal:260, categories:["ご飯・おかず"], meals:["昼食","夕食"], easy:true },
  { name:"だしバタピーマン", ingredients:"ピーマン・バター・だし", cal:70, categories:["ご飯・おかず"], meals:["昼食","夕食"], easy:true, side:true },
  { name:"サバ缶玉子丼", ingredients:"サバ缶・卵", cal:480, categories:["丼もの"], meals:["昼食","夕食"], easy:true },
  { name:"レタスのさっと和え", ingredients:"レタス・ごま油", cal:30, categories:["サラダ・軽食"], meals:["朝食","昼食","夕食"], easy:true, side:true },
  { name:"なすと油揚げのお吸い物", ingredients:"なす・油揚げ", cal:50, categories:["鍋・汁物"], meals:["昼食","夕食"], easy:true, side:true },

  // デリッシュキッチン
  { name:"牛丼", ingredients:"牛薄切り肉・玉ねぎ", cal:702, categories:["丼もの"], meals:["昼食","夕食"], easy:false },
  { name:"ふわとろ親子丼", ingredients:"鶏もも肉・玉ねぎ・卵", cal:837, categories:["丼もの"], meals:["昼食","夕食"], easy:false },
  { name:"麻婆豆腐", ingredients:"豆腐・豚ひき肉・豆板醤", cal:725, categories:["ご飯・おかず"], meals:["夕食"], easy:false },
  { name:"チーズソースのタコライス", ingredients:"合いびき肉・じゃがいも・トマト・レタス", cal:854, categories:["丼もの","ご飯・おかず"], meals:["昼食","夕食"], easy:false },
  { name:"みそ豚丼", ingredients:"豚こま切れ肉・みそ・ほうれん草", cal:704, categories:["丼もの"], meals:["昼食","夕食"], easy:true },
  { name:"濃厚味噌焼きうどん", ingredients:"豚こま切れ肉・にんじん・キャベツ", cal:569, categories:["麺類"], meals:["昼食","夕食"], easy:true },
  { name:"豚そぼろと卵の2色丼", ingredients:"豚ひき肉・卵", cal:750, categories:["丼もの"], meals:["昼食","夕食"], easy:true },
  { name:"エビたまあんかけ焼きそば", ingredients:"えび・にんじん・なす・しいたけ", cal:705, categories:["麺類"], meals:["昼食","夕食"], easy:false },
  { name:"ローストビーフ丼", ingredients:"牛かたまり肉・じゃがいも", cal:835, categories:["丼もの"], meals:["夕食"], easy:false },
  { name:"具沢山おにぎり", ingredients:"鮭・ブロッコリー", cal:546, categories:["ご飯・おかず","サラダ・軽食"], meals:["朝食","昼食"], easy:true },
  { name:"巣篭もりハンバーグ", ingredients:"合いびき肉・玉ねぎ・トマト・卵", cal:906, categories:["ご飯・おかず"], meals:["夕食"], easy:false },
  { name:"一口チキンカツ丼", ingredients:"鶏むね肉・にんじん・ごぼう", cal:725, categories:["丼もの"], meals:["昼食","夕食"], easy:false },
  { name:"ぶっかけ豆腐茶漬け", ingredients:"豆腐・豆苗・だし", cal:313, categories:["ご飯・おかず","サラダ・軽食"], meals:["朝食","昼食"], easy:true },
  { name:"切り抜きハムエッグトースト", ingredients:"トースト・チーズ・ハム・卵", cal:532, categories:["パン・洋食"], meals:["朝食"], easy:true },

  // 味の素パーク
  { name:"鶏肉入りラタトゥイユ", ingredients:"鶏肉・トマト・ズッキーニ", cal:630, categories:["ご飯・おかず"], meals:["夕食"], easy:false },
  { name:"ガパオライス", ingredients:"鶏ひき肉・バジル・卵", cal:640, categories:["ご飯・おかず","丼もの"], meals:["昼食","夕食"], easy:false },
  { name:"四川式麻婆豆腐", ingredients:"豆腐・豚ひき肉・花椒", cal:620, categories:["ご飯・おかず"], meals:["夕食"], easy:false },
  { name:"なすと大葉の肉巻きロール", ingredients:"なす・大葉・薄切り肉", cal:610, categories:["ご飯・おかず"], meals:["夕食"], easy:false },
  { name:"ズッキーニと豚肉の青じそ炒め", ingredients:"ズッキーニ・豚肉・青じそ", cal:600, categories:["ご飯・おかず"], meals:["昼食","夕食"], easy:false },
  { name:"マグロとねばねば野菜のそうめん", ingredients:"マグロ・オクラ・そうめん", cal:430, categories:["麺類"], meals:["昼食"], easy:true },
];

// ─── 朝食向けシンプルメニュー補完 ───────────────────────────
const BREAKFAST_EXTRAS = [
  { name:"納豆ご飯", ingredients:"納豆・ご飯", cal:320, categories:["ご飯・おかず"], meals:["朝食"], easy:true },
  { name:"目玉焼きトースト", ingredients:"食パン・卵・バター", cal:380, categories:["パン・洋食"], meals:["朝食"], easy:true },
  { name:"お茶漬け", ingredients:"ご飯・漬物・だし", cal:250, categories:["ご飯・おかず","サラダ・軽食"], meals:["朝食"], easy:true },
  { name:"バナナヨーグルト", ingredients:"バナナ・ヨーグルト", cal:190, categories:["サラダ・軽食"], meals:["朝食"], easy:true },
  { name:"野菜たっぷりみそ汁", ingredients:"豆腐・わかめ・玉ねぎ・みそ", cal:70, categories:["鍋・汁物"], meals:["朝食"], easy:true, side:true },
];
const ALL_RECIPES = [...RECIPES, ...BREAKFAST_EXTRAS];

// ─── ステート ─────────────────────────────────────────────
let people = 2;
const timeChips = [];
const moodChips = [];

// ─── UI ─────────────────────────────────────────────────
document.getElementById('dec').onclick = () => {
  if (people > 1) { people--; document.getElementById('people-count').textContent = people; }
};
document.getElementById('inc').onclick = () => {
  if (people < 10) { people++; document.getElementById('people-count').textContent = people; }
};

document.querySelectorAll('#time-chips .chip').forEach(c => {
  c.onclick = () => {
    c.classList.toggle('active-time');
    const v = c.dataset.val;
    const i = timeChips.indexOf(v);
    if (i > -1) timeChips.splice(i, 1); else timeChips.push(v);
  };
});

document.querySelectorAll('#mood-chips .chip').forEach(c => {
  c.onclick = () => {
    c.classList.toggle('active-mood');
    const v = c.dataset.val;
    const i = moodChips.indexOf(v);
    if (i > -1) moodChips.splice(i, 1); else moodChips.push(v);
  };
});

const easyCheck = document.getElementById('easy-check');
const easyCard  = document.getElementById('easy-card');
easyCheck.onchange = () => easyCard.classList.toggle('easy-active', easyCheck.checked);

document.getElementById('gen-btn').onclick = generate;

// ─── 献立生成ロジック ──────────────────────────────────────
function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generate() {
  const times  = timeChips.length ? [...timeChips] : ['朝食','昼食','夕食'];
  const moods  = moodChips.length ? [...moodChips] : null;
  const easy   = easyCheck.checked;

  const results = [];

  for (const time of times) {
    // メイン候補（side でないもの）
    let mains = ALL_RECIPES.filter(r =>
      r.meals.includes(time) &&
      !r.side &&
      (easy ? r.easy : true) &&
      (moods ? moods.some(m => r.categories.includes(m)) : true)
    );

    // 気分フィルターで0件なら緩める
    if (!mains.length) {
      mains = ALL_RECIPES.filter(r => r.meals.includes(time) && !r.side && (easy ? r.easy : true));
    }
    if (!mains.length) {
      mains = ALL_RECIPES.filter(r => r.meals.includes(time) && !r.side);
    }

    if (!mains.length) continue;

    const main = pickRandom(mains);

    // サイド候補（副菜・汁物）：メインと同じ食事時間帯
    const sides = ALL_RECIPES.filter(r =>
      r.meals.includes(time) &&
      r.side &&
      r.name !== main.name &&
      (easy ? r.easy : true)
    );

    const sideDishes = [];
    if (sides.length) {
      // 汁物1つ
      const soups = sides.filter(r => r.categories.includes('鍋・汁物'));
      if (soups.length) sideDishes.push(pickRandom(soups));
      // 副菜1つ（汁物以外）
      const others = sides.filter(r => !r.categories.includes('鍋・汁物'));
      if (others.length) sideDishes.push(pickRandom(others));
    }

    // 重複排除
    const allDishes = [main, ...sideDishes.filter(s => s.name !== main.name)];
    const totalCal  = allDishes.reduce((s, r) => s + r.cal, 0);

    results.push({ time, dishes: allDishes, totalCal });
  }

  renderResult(results, moods, easy);
}

// ─── 表示 ───────────────────────────────────────────────
function renderResult(results, moods, easy) {
  const area = document.getElementById('result-area');

  if (!results.length) {
    area.innerHTML = `<div class="no-result">条件に合う献立が見つかりませんでした。<br>気分の選択を外すか、ずぼら飯モードをオフにしてお試しください。</div>`;
    return;
  }

  const grandTotal = results.reduce((s, r) => s + r.totalCal, 0);
  const modeLabel  = easy ? ' · ずぼら飯モード' : '';
  const moodLabel  = moods ? moods.join('・') : '何でも';

  const rows = results.map(r => {
    const dishRows = r.dishes.map(d => `
      <div class="meal-row">
        <div class="meal-time">${r.time}</div>
        <div class="meal-info">
          <div class="meal-name">${d.name}</div>
          <div class="meal-meta">
            <span class="meal-ingredients">${d.ingredients}</span>
            <span class="cal-badge">約${d.cal}kcal</span>
            ${d.easy ? '<span class="easy-badge">⚡ 時短</span>' : ''}
          </div>
        </div>
      </div>
    `).join('');
    return dishRows;
  }).join('');

  area.innerHTML = `
    <div class="result-wrap">
      <div class="result-head">
        <div class="result-title">${people}人分 · ${moodLabel}${modeLabel}</div>
        <div class="total-cal">合計 <strong>${grandTotal}kcal</strong>/人</div>
      </div>
      ${rows}
      <button class="retry-btn" onclick="generate()">🔄 もう一度提案してもらう</button>
    </div>
  `;
}
</script>
</body>
</html>
